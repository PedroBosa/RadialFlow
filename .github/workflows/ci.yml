name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore RadialFlow.sln

      - name: Compilar solução
        run: dotnet build RadialFlow.sln -c Release --no-restore

      - name: Executar testes unitários
        run: dotnet test RadialFlow.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Upload dos resultados de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: '**/*.trx'
          if-no-files-found: warn
