name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore RadialFlow.sln

      - name: Compilar
        run: dotnet build RadialFlow.sln -c Release --no-restore

      - name: Testar
        run: dotnet test RadialFlow.sln -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Salvar os resultados dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-testes
          path: '**/*.trx'
          if-no-files-found: warn
